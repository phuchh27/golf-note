<section
  class="
    overflow-hidden
    rounded-[2rem]
    border border-white/70
    bg-white/80
    shadow-(--shadow-md)
    backdrop-blur-2xl
  "
>
  <div
    class="
      relative
      overflow-hidden
      p-8
    "
  >
    <!-- background -->

    <div
      class="
        absolute
        -right-20
        -top-20
        h-64
        w-64
        rounded-full
        bg-(--color-brand)/5
      "
    ></div>

    <div
      class="
        absolute
        -bottom-20
        -left-20
        h-56
        w-56
        rounded-full
        bg-sky-400/5
      "
    ></div>

    <div
      class="
        relative
        flex
        flex-col
        gap-8
        lg:flex-row
        lg:items-center
        lg:justify-between
      "
    >
      <!-- Left -->

      <div>
        <p
          class="
            text-sm
            font-semibold
            uppercase
            tracking-[0.25em]
            text-(--color-brand)
          "
        >
          {{ greeting() }}
        </p>

        <h2
          class="
            mt-3
            text-4xl
            font-bold
            tracking-tight
            text-(--color-text-primary)
          "
        >
          {{ userName() }}
        </h2>

        <p
          class="
            mt-5
            max-w-xl
            text-(--color-text-secondary)
            leading-7
          "
        >
          Welcome back to Golf-Note. Manage bookings, sales,
          inventory and handover from one place.
        </p>
      </div>

      <!-- Right -->

      <div
        class="
          flex
          w-full
          max-w-xs
          flex-col
          gap-4
        "
      >
        <div
          class="
            rounded-2xl
            bg-black/[0.03]
            p-5
          "
        >
          <p
            class="
              text-xs
              uppercase
              tracking-[0.2em]
              text-(--color-text-muted)
            "
          >
            Today
          </p>

          <p
            class="
              mt-2
              font-semibold
              text-(--color-text-primary)
            "
          >
            {{ today() }}
          </p>
        </div>

        <div
          class="
            rounded-2xl
            bg-(--color-brand)
            p-5
            text-white
          "
        >
          <p
            class="
              text-xs
              uppercase
              tracking-[0.2em]
              text-white/70
            "
          >
            Current Shift
          </p>

          <h3
            class="
              mt-2
              text-xl
              font-bold
            "
          >
            {{ shift() }}
          </h3>
        </div>
      </div>
    </div>
  </div>
</section>
