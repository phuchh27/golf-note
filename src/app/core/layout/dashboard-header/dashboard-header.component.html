<header
  class="
    mb-8
    flex
    flex-col
    gap-5
    lg:flex-row
    lg:items-center
    lg:justify-between
  "
>
  <div class="gn-slide-right">

    <p
      class="
        text-xs
        font-bold
        uppercase
        tracking-[0.25em]
        text-(--color-brand)
      "
    >
      {{ greeting() }}
    </p>

    <h1
      class="
        mt-2
        text-3xl
        font-bold
        tracking-tight
        text-(--color-text-primary)
      "
    >
      {{ pageTitle() }}
    </h1>

    <p
      class="
        mt-2
        text-sm
        text-(--color-text-secondary)
      "
    >
      Welcome back,

      <span class="font-semibold text-(--color-text-primary)">
        {{ currentUser()?.fullName }}
      </span>
    </p>

  </div>

  <app-user-menu />
</header>
