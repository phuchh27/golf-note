<div
  class="relative z-50"
  (click)="stop($event)"
>

  <!-- Avatar Button -->

  <button
    type="button"
    (click)="toggle()"
    class="
      flex
      items-center
      gap-3
      rounded-3xl
      border
      border-white/70
      bg-white/80
      px-3
      py-2
      shadow-(--shadow-md)
      backdrop-blur-xl
      transition-all
      duration-200
      hover:-translate-y-0.5
    "
  >

    <div
      class="
        flex
        h-11
        w-11
        items-center
        justify-center
        rounded-2xl
        bg-(--color-brand)
        text-white
        font-bold
      "
    >
      {{ currentUser()?.fullName?.charAt(0) }}
    </div>

    <div class="hidden text-left sm:block">

      <p
        class="
          text-sm
          font-semibold
          text-(--color-text-primary)
        "
      >
        {{ currentUser()?.fullName }}
      </p>

      <p
        class="
          text-xs
          text-(--color-text-secondary)
        "
      >
        {{ currentUser()?.roles?.[0] }}
      </p>

    </div>

    <app-icon
      name="chevron-down"
      [size]="18"
    />

  </button>

  @if (isOpen()) {

    <div
      class="
        absolute
        right-0
        mt-3
        w-72
        overflow-hidden
        rounded-4xl
        border
        border-white/70
        bg-white/85
        shadow-(--shadow-lg)
        backdrop-blur-2xl
        gn-scale-in
      "
    >

      <!-- User -->

      <div class="border-b border-black/5 p-5">

        <div class="flex items-center gap-3">

          <div
            class="
              flex
              h-12
              w-12
              items-center
              justify-center
              rounded-2xl
              bg-(--color-brand)
              font-bold
              text-white
            "
          >
            {{ currentUser()?.fullName?.charAt(0) }}
          </div>

          <div>

            <p
              class="
                font-semibold
                text-(--color-text-primary)
              "
            >
              {{ currentUser()?.fullName }}
            </p>

            <p
              class="
                text-sm
                text-(--color-text-secondary)
              "
            >
              {{ currentUser()?.username }}
            </p>

          </div>

        </div>

      </div>

      <!-- MENU -->

      <button class="flex w-full items-center gap-3 px-5 py-4 hover:bg-black/[0.03]">
        <app-icon name="user" [size]="20"/>
        Profile
      </button>

      <button class="flex w-full items-center gap-3 px-5 py-4 hover:bg-black/[0.03]">
        <app-icon name="language" [size]="20"/>
        Language
      </button>

      <button class="flex w-full items-center gap-3 px-5 py-4 hover:bg-black/[0.03]">
        <app-icon name="theme" [size]="20"/>
        Appearance
      </button>

      <button class="flex w-full items-center gap-3 px-5 py-4 hover:bg-black/[0.03]">
        <app-icon name="notification" [size]="20"/>
        Notifications
      </button>

      <div class="mx-5 border-t border-black/5"></div>

      <button
        (click)="logout()"
        class="
          flex
          w-full
          items-center
          gap-3
          px-5
          py-4
          text-red-500
          hover:bg-red-50
        "
      >
        <app-icon
          name="logout"
          [size]="20"
        />

        Logout

      </button>

    </div>

  }

</div>
